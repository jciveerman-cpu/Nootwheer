services:
  - type: web
    name: laddercompetitie
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: laddercompetitie-db
          property: connectionString

databases:
  - name: laddercompetitie-db
    plan: free
